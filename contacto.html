<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseñador Gráfico | Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container">
            <a href="index.html" class="logo">Mi Portafolio</a>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="portafolio.html">Portafolio</a></li>
                    <li><a href="contacto.html" class="active">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="contacto-form">
            <div class="container">
                <h2>Ponte en contacto</h2>
                <p>Si tienes un proyecto en mente o simplemente quieres saludar, ¡escríbeme!</p>
                
                <form action="#" method="post">
                    <label for="nombre">Tu Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="email">Tu Correo:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="mensaje">Tu Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="6" required></textarea>

                    <button type="submit" class="btn">Enviar Mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 [Tu Nombre]. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
